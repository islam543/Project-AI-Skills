## Recommended Fixes

List fixes in priority order.

For each fix:

- Fix:
- Why:
- Files likely affected:
- Risk:
- Tests needed:

## Manual QA Checklist

Provide a manual test checklist.

Example:

1. Open page.
2. Verify loading state.
3. Simulate API failure.
4. Verify error message.
5. Submit empty form.
6. Verify validation errors.
7. Submit valid form.
8. Verify success state.
9. Refresh page.
10. Verify data remains correct.

## Frontend Tests to Add

List tests:

- Test name:
- Type:
- Description:
- Priority:

## What Not to Change

List areas that should not be rewritten or redesigned.

Only include this section if relevant.

## Questions / Missing Context

List anything needed to complete the review.

## Rules

- Keep the review read-only.
- Do not redesign large parts of the UI unless approved.
- Preserve existing design system.
- Prefer small safe UI improvements.
- Always prioritize loading, error, empty, and validation states.
- Do not expose raw backend errors.
- Do not expose secrets or sensitive data.
- Do not recommend new UI libraries unless necessary.
- If requirements are unclear, list questions.
- If evidence is missing, say what files need inspection.

Work read-only. Do not modify files.

Resolve optional references only if they exist. Use the available Codex tools and permissions.
"""
